<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uploaded Images</title>
    <!-- Include Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff; /* White background */
            color: #333;
        }

        h2 {
            text-align: center;
            margin: 20px 0;
            color: #007BFF; /* Blue heading */
        }

        .title-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #f0f0f0;
            border-bottom: 2px solid #ddd;
        }

        .title-container h3 {
            margin: 0;
            color: #444;
        }

        .download-all-btn {
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            font-size: 14px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .download-all-btn:hover {
            background-color: #0056b3; /* Darker blue on hover */
        }

        .image-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
            justify-content: flex-start;
        }

        .image-item {
            position: relative;
            width: 200px;
            height: 250px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
            background-color: white;
        }

        .image-item img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-bottom: 1px solid #ddd;
        }

        .image-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
        }

        .icon-btn {
            background: white; /* White background */
            border: 2px solid #007bff; /* Blue border */
            color: #007bff; /* Blue icon */
            cursor: pointer;
            font-size: 18px;
            padding: 6px;
            border-radius: 5px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .icon-btn:hover {
            background-color: #007bff; /* Blue background on hover */
            color: white; /* White icon on hover */
        }

        a {
            color: #007bff; /* Blue links */
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .image-container {
                justify-content: center;
            }

            .title-container {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <h2>Displaying Images from {{ year }}-{{ month }}</h2>

    {% for title, files in categorized_files.items() %}
        <div class="title-container">
            <h3>Category: {{ title }}</h3>
            <!-- Add Download All Button for the category -->
            <a href="{{ url_for('download_all', title=title, year=year, month=month) }}">
                <button class="download-all-btn">Download All</button>
            </a>
        </div>
        
        <div class="image-container">
            {% for file in files %}
                <div class="image-item">
                    <img src="{{ url_for('serve_image', file_id=file.id) }}" alt="{{ file.filename }}">

                    <div class="image-actions">
                        <!-- Download Button with Icon -->
                        <a href="{{ url_for('serve_image', file_id=file.id) }}" download="{{ file.filename }}">
                            <button class="icon-btn" title="Download">
                                <i class="fas fa-download"></i>
                            </button>
                        </a>
                        
                        <!-- Delete Button with Icon -->
                        {% if is_admin %}
                        <form method="POST" action="/remove_image/{{ file.id }}" 
                              onsubmit="return confirm('Are you sure you want to delete this image?');" style="margin: 0;">
                            <input type="hidden" name="_method" value="DELETE">
                            <button type="submit" class="icon-btn" title="Delete">
                                <i class="fas fa-trash"></i>
                            </button>
                        </form>
                        {% endif %}
                    </div>
                </div>
            {% endfor %}
        </div>
    {% endfor %}

    <br>
   
</body>
</html>
