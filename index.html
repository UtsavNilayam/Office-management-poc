<!DOCTYPE html>
<html lang="en">

<head>
    <title>Auth System</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        /* Logo */
        .logo {
            max-width: 150px;
            width: 100%;
            height: auto;
            margin-bottom: 30px;
        }

        /* Button Styles */
        .btn-custom {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 30px;
            transition: all 0.3s ease;
            display: block;
            width: 100%;
            margin-bottom: 15px; /* Margin between buttons */
        }

        .btn-admin {
            background-color: #4CAF50;
            color: white;
            border: none;
        }

        .btn-admin:hover {
            background-color: #45a049;
            transform: translateY(-2px);
        }

        .btn-user {
            background-color: #007bff;
            color: white;
            border: none;
        }

        .btn-user:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }

        /* Footer link styles */
        .footer-link {
            margin-top: 20px;
            font-size: 14px;
        }

        .footer-link a {
            color: #007bff;
            text-decoration: none;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- Logo -->
        <img src="static/image.png" alt="Company Logo" class="logo">

        <!-- Welcome Message -->
        <h1 style="color: #333;">Welcome!</h1>
        <p style="color: #666; margin-bottom: 30px;">Please choose an option </p>

        <!-- Buttons for Admin and User Login -->
        <a href="/admin-login" class="btn btn-custom btn-admin">Admin Login</a>
        <a href="/login" class="btn btn-custom btn-user">User Login</a>

        <!-- Footer or Additional Links -->
        
    </div>

</body>

</html>
