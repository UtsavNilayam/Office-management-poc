<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Change Password</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src=" https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/boxicons@latest/css/boxicons.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        
        @import url("https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap");

        :root {
            --header-height: 3rem;
            --nav-width: 68px;
            --first-color: #4723D9;
            --first-color-light:rgb(241, 246, 243);
            --white-color: #F7F6FB;
            --body-font: 'Nunito', sans-serif;
            --normal-font-size: 1rem;
            --z-fixed: 100;
        }
        
        *, ::before, ::after {
            box-sizing: border-box;
        }
        
        body {
            position: relative;
            margin: var(--header-height) 0 0 0;
            padding: 0 1rem;
            font-family: var(--body-font);
            font-size: var(--normal-font-size);
            transition: .5s;
        }
        
        a {
            text-decoration: none;
        }
        
        .header {
            width: 100%;
            height: var(--header-height);
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            background-color: var(--white-color);
            z-index: var(--z-fixed);
            transition: .5s;
        }
        
        .header_toggle {
            color: var(--first-color);
            font-size: 1.5rem;
            cursor: pointer;
        }
        
        .header_img {
            width: 35px;
            height: 35px;
            display: flex;
            justify-content: center;
            border-radius: 50%;
            overflow: hidden;
        }
        
        .header_img img {
            width: 40px;
        }
        
        .l-navbar {
            position: fixed;
            top: 0;
            left: -30%;
            width: var(--nav-width);
            height: 100vh;
            background-color: var(--first-color);
            padding: .5rem 1rem 0 0;
            transition: .5s;
            z-index: var(--z-fixed);
        }
        
        .nav {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }
        
        .nav_logo, .nav_link {
            display: grid;
            grid-template-columns: max-content max-content;
            align-items: center;
            column-gap: 1rem;
            padding: .5rem 0 .5rem 1.5rem;

        }
        
        .nav_logo {
            margin-bottom: 2rem;
        }
        
        .nav_logo-icon {
            font-size: 1.5rem;
            color: var(--white-color);
        }
        
        .nav_logo-name {
            color: var(--white-color);
            font-weight: 700;
        }
        
        .nav_link {
            position: relative;
            color: var(--first-color-light);
            margin-bottom: 1.5rem;
            transition: .3s;
            
        }
        
        .nav_link:hover {
            color: black !important;  /* Ensures the text color changes to black */
        }
        
        .nav_link .nav_icon {
            color: var(--first-color-light);  /* Default icon color */
        }
        
        .nav_link:hover .nav_icon {
            color: black !important;  /* Ensures the icon color changes to black */
        }
        
        .nav_icon {
            font-size: 1.24rem;
        }
        
        .show {
            left: 0;
        }
        
        .body-pd {
            padding-left: calc(var(--nav-width) + 1rem);
        }
        
        .active {
            color: var(--first-color);
            width: 60px;
            height: 40px;
            font-size: 1.05rem;
            color: var(--white-color);
        }
        
        .active::before {
            content: '';
            position: absolute;
            left: 0;
            width: 10px;
            height: 50px;
            background-color: var(--white-color);
            font-size: 1.25rem;
            color: var(--white-color);
        }
        
        .height-100 {
            height: 100vh;
        }
        
        @media screen and (min-width: 768px) {
            body {
                margin: calc(var(--header-height) + 1rem) 0 0 0;
                padding-left: calc(var(--nav-width) + 2rem);
            }
        
            .header {
                height: calc(var(--header-height) + 1rem);
                padding: 0 2rem 0 calc(var(--nav-width) + 2rem);
            }
        
            .header_img {
                width: 40px;
                height: 40px;
            }
        
            .header_img img {
                width: 45px;
            }
        
            .l-navbar {
                left: 0;
                padding: 1rem 1rem 0 0;
            }
        
            .show {
                width: calc(var(--nav-width) + 156px);
            }
        
            .body-pd {
                padding-left: calc(var(--nav-width) + 188px);
            }
        }
   
        
    </style>
</head>
<body>
    <div class="container-fluid">  
        <id id="body-pd">
            <header class="header" id="header">
                <div class="header_toggle" style="color: black";> <i class='bx bx-menu' id="header-toggle"></i><span class="text-sm-start fs-5">&nbsp; Welcome {{user.name}}</span> </div>
                <div class="header_img"> <img src="/static/image.png"> </div>
            </header>
                        <div div class="container-fluid">   
                            <div class="row l-navbar" id="nav-bar">
        
                                <nav class="nav">
                                    <div> 
                                        
                                        <div class="nav_list"> 
                                            <a href="/home" class="nav_link active"> 
                                                <i class='bx bx-layer '></i> 
                                                <span class="nav_name">Profile</span> 
                                            </a>
                                            <a href="/submit_issue" class="nav_link active"> 
                                               
                                                <i class="bi bi-person-raised-hand"></i>
                                                <span class="nav_name">Service Request</span> 
                                            </a> 
                                                   
                                                    <a href="/history" class="nav_link active"> 
                                                        <i class='bx bx-message-square-detail '></i> 
                                                        <span class="nav_name">Ticket History</span> 
                                                    </a> 
                                                 
                                                    <a href="/filter_image2" class="nav_link active"> 
                                                        <i class="bi bi-card-image"></i>
                                                        <span class="nav_name">Gallery</span> 
                                                    </a> 
                                                    <a href="/change" class="nav_link active">
                                                        <i class="bi bi-lock text-dark"></i> 
                                                        <span class="nav_name text-dark">Change password</span> 
                                                    </a> 
                                                </div>
                                            </div> 
                                            <a href="/logout2" class="nav_link active"> 
                                                <i class='bx bx-log-out nav_icon'></i> 
                                                <span class="nav_name">SignOut</span> 
                                            </a>
                                        </nav>
        
        
                                        
                                        </div>
                                        <div class="container">
        
                                        <div class="col-md-12 col-lg-10 col-xl-10 p-3 ms-5 mt-2">
                                            <div class="row justify-content-center">
                                                <div class="col-md-6 col-lg-6 col-xl-5 mx-auto"> <!-- mx-auto centers the content horizontally -->
                                                    <div class="card p-4 custom-card">
                                                        <h3 class="text-center mb-4"><b>Change Password</b></h3>
                                                        <form method="POST" action="/change">
                                                            <div class="mb-3">
                                                                <label for="current-password" class="form-label">Current Password</label>
                                                                <input type="password" id="current-password" name="current_password" class="form-control" required>
                                                            </div>
                                                            <div class="mb-3">
                                                                <label for="new-password" class="form-label">New Password</label>
                                                                <input type="password" id="new-password" name="new_password" class="form-control" required>
                                                            </div>
                                                            <div class="mb-3">
                                                                <label for="confirm-password" class="form-label">Confirm New Password</label>
                                                                <input type="password" id="confirm-password" name="confirm_password" class="form-control" required>
                                                            </div>
                                                            <button type="submit" class="btn btn-primary w-100">Update Password</button>
                                                        </form>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                        
    <!-- Top Navbar -->
    
    <!-- Main Content -->
    
    
<script>document.addEventListener("DOMContentLoaded", function(event) {
    const showNavbar = (toggleId, navId, bodyId, headerId) =>{
    const toggle = document.getElementById(toggleId),
    nav = document.getElementById(navId),
    bodypd = document.getElementById(bodyId),
    headerpd = document.getElementById(headerId)
     
    // Validate that all variables exist
    if(toggle && nav && bodypd && headerpd){
    toggle.addEventListener('click', ()=>{
    // show navbar
    nav.classList.toggle('show')
    // change icon
    toggle.classList.toggle('bx-x')
    // add padding to body
    bodypd.classList.toggle('body-pd')
    // add padding to header
    headerpd.classList.toggle('body-pd')
    })
    }
    }
     
    showNavbar('header-toggle','nav-bar','body-pd','header')
     
    /*===== LINK ACTIVE =====*/
    const linkColor = document.querySelectorAll('.nav_link')
     
    function colorLink(){
    if(linkColor){
    linkColor.forEach(l=> l.classList.remove('active'))
    this.classList.add('active')
    }
    }
    linkColor.forEach(l=> l.addEventListener('click', colorLink))
     
    // Your code to run since DOM is loaded and ready
    });</script>

    
</body>
</html>
