<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uploaded Images</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
        }
        h2 {
            text-align: center;
            margin: 20px 0;
            color: #007BFF;
        }
        .title-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #f0f0f0;
            border-bottom: 2px solid #ddd;
        }
        .title-container h3 {
            margin: 0;
            color: #444;
        }
        .download-all-btn {
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            font-size: 14px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .download-all-btn:hover {
            background-color: #0056b3;
        }
        .image-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
            justify-content: flex-start;
        }
        .image-item {
            position: relative;
            width: 200px;
            height: 250px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
            background-color: white;
        }
        .image-item img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-bottom: 1px solid #ddd;
        }
        .image-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
        }
        .delete-btn, .download-btn {
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .delete-btn {
            background-color: #dc3545;
            color: white;
        }
        .delete-btn:hover {
            background-color: #c82333;
        }
        .download-btn {
            background-color: #28a745;
            color: white;
        }
        .download-btn:hover {
            background-color: #218838;
        }
        a {
            color: #007bff;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h2>Displaying Images from {{ year }}-{{ month }}</h2>

    {% for title, files in categorized_files.items() %}
        <div class="title-container">
            <h3>Category: {{ title }}</h3>
            <!-- Add Download All Button for the category -->
            <a href="{{ url_for('download_all', title=title, year=year, month=month) }}">
                <button class="download-all-btn">Download All</button>
            </a>
        </div>
        
        <div class="image-container">
            {% for file in files %}
                <div class="image-item">
                    <img src="{{ url_for('serve_image', file_id=file.id) }}" alt="{{ file.filename }}">

                    <div class="image-actions">
                        <a href="{{ url_for('serve_image', file_id=file.id) }}" download="{{ file.filename }}">
                            <button class="download-btn">Download</button>
                        </a>
                        
                    </div>
                </div>
            {% endfor %}
        </div>
    {% endfor %}

    <br>
    <div style="text-align: center;">
        <a href="/">Go back to upload page</a>
    </div>

</body>
</html>
