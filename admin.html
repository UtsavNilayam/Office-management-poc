<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            height: 100vh;
        }

        /* Header Section with light blue background */
        .header {
            background-color: #0062cc;; /* Light blue color */
            padding: 10px 10px;
            border-bottom: 2px solid #ccc;
            display: flex;
            align-items: center;
            justify-content: start;
            position: relative;
        
        }

        .header .logo {
            width: 50px;
            height: 50px;
            position: absolute;
            left: 7px; /* Position the logo on the left */
        }

        /* Black Heading */
        .header h1 {
            color: white; /* Black color for the heading */
            font-size: 24px;
            margin: 0;
            text-align: center;
            font-weight: bold; /* Bold text */
            flex-grow: 1; /* Allow the heading to take the remaining space */
        }

        /* Form Centering */
        .form-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 60px); /* Adjust for the header height */
        }

        .box {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 400px;
            max-width: 100%;
            margin: 20px;
        }

        .box h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .form-footer {
            text-align: center;
            margin-top: 10px;
        }

        .form-footer a {
            color: #007bff;
            text-decoration: none;
        }

        .form-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div class="header">
        <img src="static/image.png" alt="Company Logo" class="logo"> <!-- Replace with your logo path -->
        <h1>DGLiger</h1>
    </div>

    <!-- Form Centering -->
    <div class="form-container">
        <div class="box">
            <h2>Admin Login</h2>

            <!-- Admin Login Form -->
            <form action="/admin-login" method="POST">
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="Enter email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                </div>
                <a href="/get_email" class="logout-btn">Forget Password</a>

                <!-- Display error message if login fails -->
                {% if error %}
                    <div class="alert alert-danger">
                        {{ error }}
                    </div>
                {% endif %}

                <button type="submit" class="btn btn-dark btn-block">Login</button>
            </form>
        </div>
    </div>

</body>
</html>
