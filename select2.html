<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Images</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src=" https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/boxicons@latest/css/boxicons.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body, html {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #e9ecef;
            color: #333;
        }

        /* Top Navbar */
        .top-navbar {
            display: flex;
            align-items: center;
            background-image: url('/static/bg.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            padding: 15px 20px;
            color: white;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            height: 50px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            justify-content: space-between;
        }
        
        .top-navbar .left-section {
            display: flex;
            align-items: center;
        }
        
        .top-navbar .welcome-text {
            font-size: 18px;
            color: white;
            white-space: nowrap;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 5px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
        }
        
        .top-navbar .center-logo {
            height: 80px;
            width: 80px;
            border-radius: 50%;
            object-fit: cover;
        }
        
        /* Sidebar */
        .sidebar {
            width: 140px;
            background-color: white;
            height: 100vh;
            position: fixed;
            top: 60px;
            left: 0;
            padding: 10px;
            color: white;
            overflow-y: auto;
        }
        
        .sidebar .logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 14px;
            margin-bottom: 10px;
        }
        
        .sidebar .logo img {
            height: 65px;
            width: 65px;
            object-fit: contain;
            border: none;
        }
        
        .sidebar .logo h4 {
            margin-top: 5px;
            font-size: 16px;
            color: black;
            text-align: center;
        }
        
        .sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .sidebar ul li {
            margin: 8px 0;
            padding: 12px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s, box-shadow 0.3s;
            background-color: #f8f9fc;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        .sidebar ul li:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        
        .sidebar ul li img {
            height: 28px;
            width: 28px;
            margin-bottom: 5px;
            border: none;
        }
        
        .sidebar ul li a {
            text-decoration: none;
            color: black;
            font-size: 14px;
        }
        

        /* Filter Form Section */
        .form-container {
            max-width: 600px;
            margin: 150px auto;  /* Adjusted margin-top to account for fixed navbar */
            background-color: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #ddd;
            text-align: center;
        }

        .form-container select,
        .form-container button {
            width: 80%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 1em;
            background-color: #fdf5e6;
            margin: 10px auto;
            display: block;
        }

        .form-container button {
            background-color: #4682B4;
            color: white;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .form-container button:hover {
            background-color: #4169E1;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #4682B4;
            text-decoration: none;
            font-weight: bold;
        }


        .back-link a:hover {
            text-decoration: underline;
        }

        @import url("https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap");

        :root {
            --header-height: 3rem;
            --nav-width: 68px;
            --first-color: #4723D9;
            --first-color-light: #AFA5D9;
            --white-color: #F7F6FB;
            --body-font: 'Nunito', sans-serif;
            --normal-font-size: 1rem;
            --z-fixed: 100;
        }
        
        *, ::before, ::after {
            box-sizing: border-box;
        }
        
        body {
            position: relative;
            margin: var(--header-height) 0 0 0;
            padding: 0 1rem;
            font-family: var(--body-font);
            font-size: var(--normal-font-size);
            transition: .5s;
        }
        
        a {
            text-decoration: none;
        }
        
        .header {
            width: 100%;
            height: var(--header-height);
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            background-color: var(--white-color);
            z-index: var(--z-fixed);
            transition: .5s;
        }
        
        .header_toggle {
            color: var(--first-color);
            font-size: 1.5rem;
            cursor: pointer;
        }
        
        .header_img {
            width: 35px;
            height: 35px;
            display: flex;
            justify-content: center;
            border-radius: 50%;
            overflow: hidden;
        }
        
        .header_img img {
            width: 40px;
        }
        
        .l-navbar {
            position: fixed;
            top: 0;
            left: -30%;
            width: var(--nav-width);
            height: 100vh;
            background-color: var(--first-color);
            padding: .5rem 1rem 0 0;
            transition: .5s;
            z-index: var(--z-fixed);
        }
        
        .nav {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }
        
        .nav_logo, .nav_link {
            display: grid;
            grid-template-columns: max-content max-content;
            align-items: center;
            column-gap: 1rem;
            padding: .5rem 0 .5rem 1.5rem;
        }
        
        .nav_logo {
            margin-bottom: 2rem;
        }
        
        .nav_logo-icon {
            font-size: 1.25rem;
            color: var(--white-color);
        }
        
        .nav_logo-name {
            color: var(--white-color);
            font-weight: 700;
        }
        
        .nav_link {
            position: relative;
            color: var(--first-color-light);
            margin-bottom: 1.5rem;
            transition: .3s;
        }
        
        .nav_link:hover {
            color: black !important;  /* Ensures the text color changes to black */
        }
        
        .nav_link .nav_icon {
            color: var(--first-color-light);  /* Default icon color */
        }
        
        .nav_link:hover .nav_icon {
            color: black !important;  /* Ensures the icon color changes to black */
        }
        
        .nav_icon {
            font-size: 1.24rem;
        }
        
        .show {
            left: 0;
        }
        
        .body-pd {
            padding-left: calc(var(--nav-width) + 1rem);
        }
        
        .active {
            color: var(--white-color);
            width: 60px;
            height: 40px;
            font-size: 1.05rem;
            color: var(--white-color);
        }
        
        .active::before {
            content: '';
            position: absolute;
            left: 0;
            width: 10px;
            height: 50px;
            background-color: var(--white-color);
            font-size: 1.25rem;
            color: var(--white-color);
        }
        
        .height-100 {
            height: 100vh;
        }
        
        @media screen and (min-width: 768px) {
            body {
                margin: calc(var(--header-height) + 1rem) 0 0 0;
                padding-left: calc(var(--nav-width) + 2rem);
            }
        
            .header {
                height: calc(var(--header-height) + 1rem);
                padding: 0 2rem 0 calc(var(--nav-width) + 2rem);
            }
        
            .header_img {
                width: 40px;
                height: 40px;
            }
        
            .header_img img {
                width: 45px;
            }
        
            .l-navbar {
                left: 0;
                padding: 1rem 1rem 0 0;
            }
        
            .show {
                width: calc(var(--nav-width) + 156px);
            }
        
            .body-pd {
                padding-left: calc(var(--nav-width) + 188px);
            }
        }
        
   
    </style>
</head>
<body>
    <div class="container-fluid">  
        <id id="body-pd">
            <header class="header" id="header">
                <div class="header_toggle" style="color: Black";> <i class='bx bx-menu' id="header-toggle"></i><span class="text-sm-start fs-5">&nbsp; Welcome  </span> </div>
                <div class="header_img"> <img src="/static/image.png"> </div>
            </header>
                        <div div class="contaainer-fluid">   
                            <div class="row l-navbar" id="nav-bar">
        
                                <nav class="nav">
                            <div> 
                                
                                <div class="nav_list"> 
                                    <a href="/home" class="nav_link active"> 
                                        <i class='bx bx-layer '></i> 
                                        <span class="nav_name">Profile</span> 
                                    </a>
                                    <a href="/submit_issue" class="nav_link active"> 
                                       
                                        <i class="bi bi-person-raised-hand"></i>
                                        <span class="nav_name">Service Request</span> 
                                    </a> 
                                           
                                            <a href="/history" class="nav_link active"> 
                                                <i class='bx bx-message-square-detail '></i> 
                                                <span class="nav_name">Ticket History</span> 
                                            </a> 
                                         
                                            <a href="/filter_image2" class="nav_link active"> 
                                                <i class="bi bi-card-image text-dark"></i>
                                                <span class="nav_nam text-dark">Gallery</span> 
                                            </a> 
                                            <a href="/change" class="nav_link active">
                                                <i class="bi bi-lock"></i> 
                                                <span class="nav_name"Change password</span> 
                                            </a> 
                                        </div>
                                    </div> 
                                    <a href="/logout2" class="nav_link active"> 
                                        <i class='bx bx-log-out nav_icon'></i> 
                                        <span class="nav_name">SignOut</span> 
                                    </a>
                                </nav>
                                        
                                        </div>
        
   
    <!-- Filter Form Section -->
    <div class="form-container">
        <form action="/filter_image" method="POST">
            <div>
                <select name="year" required>
                    <option value="">Choose year</option>
                    {% for year in distinct_years %}
                    <option value="{{ year[0] }}">{{ year[0] }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <select name="month" required>
                    <option value="">Choose month</option>
                    {% for month in distinct_months %}
                    <option value="{{ month[0] }}">{{ month[0]|int|to_month_name }}</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit">Filter</button>
        </form>
    </div>

    <!-- Back to Home Link -->
    <script>document.addEventListener("DOMContentLoaded", function(event) {
        const showNavbar = (toggleId, navId, bodyId, headerId) =>{
        const toggle = document.getElementById(toggleId),
        nav = document.getElementById(navId),
        bodypd = document.getElementById(bodyId),
        headerpd = document.getElementById(headerId)
         
        // Validate that all variables exist
        if(toggle && nav && bodypd && headerpd){
        toggle.addEventListener('click', ()=>{
        // show navbar
        nav.classList.toggle('show')
        // change icon
        toggle.classList.toggle('bx-x')
        // add padding to body
        bodypd.classList.toggle('body-pd')
        // add padding to header
        headerpd.classList.toggle('body-pd')
        })
        }
        }
         
        showNavbar('header-toggle','nav-bar','body-pd','header')
         
        /*===== LINK ACTIVE =====*/
        const linkColor = document.querySelectorAll('.nav_link')
         
        function colorLink(){
        if(linkColor){
        linkColor.forEach(l=> l.classList.remove('active'))
        this.classList.add('active')
        }
        }
        linkColor.forEach(l=> l.addEventListener('click', colorLink))
         
        // Your code to run since DOM is loaded and ready
        });</script>
     


       

</body>
</html>
