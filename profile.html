<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
        }

        .profile-card {
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            background-color: white;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
        }

        .profile-header {
            text-align: center;
        }

        .profile-header h3 {
            margin-bottom: 10px;
        }

        .profile-header p {
            margin: 5px 0;
            color: #555;
        }

        .logout-btn {
            margin-top: 20px;
            background-color: #e74a3b;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        .logout-btn:hover {
            background-color: #c0692b;
        }
    </style>
</head>

<body>

    <div class="profile-card">
        <div class="profile-header">
            <!-- Profile Image -->
            <img src="/static/face.png" alt="Profile Picture" class="profile-img">
            <p><strong>Name:</strong> {{ user.name }}</p>
            <p><strong>Email:</strong> {{ user.email }}</p>
            <p><strong>Date of Birth:</strong> {{ user.birthday }}</p>
            <p><strong>Position:</strong> Associate Engineer</p>

        </div>

        <!-- Logout Button -->
        
    </div>

</body>

</html>
