<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-5">
    <h2 class="text-center">Your Last Submitted Issue</h2>

    <!-- Check if there is an issue to display -->
    {% if issue %}
        <div class="card mt-4">
            <div class="card-header bg-dark text-white">
                Issue Details
            </div>
            <div class="card-body">
                <h5 class="card-title">Issue Status: <span class="text-info">{{ issue.status }}</span></h5>
                <p class="card-text">Problem Description:</p>
                <p>{{ issue.problem }}</p>
                <p class="card-text"><small class="text-muted">Submitted on: {{ issue.date_submitted }}</small></p>
            </div>
        </div>
    {% else %}
        <p class="text-center text-danger">No issue found.</p>
    {% endif %}
</div>

</body>
</html>
