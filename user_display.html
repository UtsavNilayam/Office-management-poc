<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Images</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f5f5f5; color: #333;">

    <h2 style="text-align: center; margin: 20px 0; color: #007BFF;">Images from {{ year }}-{{ month }}</h2>

    {% for title, files in categorized_files.items() %}
        <div style="padding: 10px 20px; background-color: #f0f0f0; border-bottom: 2px solid #ddd; margin-top: 20px;">
            <h3 style="margin: 0; color: #444;">Category: {{ title }}</h3>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; justify-content: flex-start;">
            {% for file in files %}
                <div style="position: relative; width: 200px; height: 250px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); border-radius: 8px; overflow: hidden; background-color: white;">
                    <img src="{{ url_for('serve_image', file_id=file.id) }}" alt="{{ file.filename }}" style="width: 100%; height: 180px; object-fit: cover; border-bottom: 1px solid #ddd;">
                    <div style="padding: 10px; text-align: center;">
                        <a href="{{ url_for('serve_image', file_id=file.id) }}" download="{{ file.filename }}">
                            <button style="background-color: #28a745; color: white; padding: 8px 12px; border: none; border-radius: 5px; font-size: 14px; cursor: pointer; transition: background-color 0.3s ease;">Download</button>
                        </a>
                    </div>
                </div>
            {% endfor %}
        </div>
    {% endfor %}

    <div style="text-align: center; margin-top: 30px;">
        <a href="/" style="text-decoration: none; color: #007bff;">Go Back to Home</a>
    </div>
</body>
</html>
